name: Clean workflow runs
on:
  schedule:
    - cron: '0 0 1 * *'
# Run monthly, at 00:00 on the 1st day of month.
  workflow_dispatch:
    inputs:
      days:
        description: 'Days-worth of runs to keep for each workflow'
        required: true
        default: '30'
      minimum_runs:
        description: 'Minimum runs to keep for each workflow'
        required: true
        default: '6'

jobs:
  delete_runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Clean workflow runs
        # You may pin to the exact commit or the version.
        uses: Mattraks/delete-workflow-runs@v2
        with:
          # The default GITHUB_TOKEN is enough for same-repo cleanup, no PAT needed.
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          # Days-worth of runs to keep for each workflow.
          retain_days: ${{ github.event.inputs.days || 30 }}
          # Minimum runs to keep for each workflow, even if older than retain_days.
          keep_minimum_runs: ${{ github.event.inputs.minimum_runs || 6 }}
